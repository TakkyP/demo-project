{% extends "base.html" %}
{% block title %}ตั้งค่าครั้งแรก{% endblock %}
{% block content %}
<div class="auth card">
  <h1>ตั้งค่าครั้งแรก</h1>
  <p class="muted">สร้างบัญชี <b>นายจ้าง</b> คนแรกของระบบ จากนั้นจึงเพิ่มลูกจ้างได้ที่แท็บ "จัดการบุคคล"</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>ชื่อที่แสดง <input name="name" required></label>
    <label>ชื่อผู้ใช้ <input name="username" required autocomplete="username"></label>
    <label>รหัสผ่าน (อย่างน้อย 6 ตัว) <input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
    <button class="btn btn-primary btn-block">สร้างบัญชี</button>
  </form>
</div>
{% endblock %}
