{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="auth card">
  <h1>✓ Worklist</h1>
  <p class="muted">เข้าสู่ระบบเพื่อดูรายการงาน</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>ชื่อผู้ใช้ <input name="username" required autofocus autocomplete="username"></label>
    <label>รหัสผ่าน <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
  </form>
</div>
{% endblock %}
